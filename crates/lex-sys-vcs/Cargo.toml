[package]
name = "lex-sys-vcs"
description = "Content-addressed operation log for lex-sys programs (docs/vcs.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lex-sys-syntax.workspace = true
lex-sys-ir.workspace = true
# `lex-os-audit`'s own choice (docs/vcs.md §5's "shares the idea and no
# code" -- here, the same audited signing crate rather than a second
# implementation of Ed25519 for a job this one already does correctly
# and safely). `std.ed25519` (docs/ed25519.md) is explicitly not this:
# it is for a future lex-sys port of lex-os-guest, not this crate.
ed25519-dalek = "2"
hex = "0.4"

[dev-dependencies]
lex-sys-id.workspace = true
serde_json = "1"
hex = "0.4"
